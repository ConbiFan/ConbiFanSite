<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>Conbi Fan - Blog</title>
  <link rel="stylesheet" href="site-interactions.css">
  <style>
    :root {
      --bg: #09111f;
      --panel: rgba(15, 23, 42, 0.84);
      --border: rgba(148, 163, 184, 0.18);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 28%),
        linear-gradient(180deg, #0a1326, var(--bg));
    }

    a {
      color: #bae6fd;
      text-decoration: none;
    }

    .hero {
      padding: 64px 24px 40px;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.88), rgba(14, 165, 233, 0.72)),
        linear-gradient(180deg, rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.12));
    }

    .hero__inner {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: rgba(239, 246, 255, 0.82);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      line-height: 1;
    }

    .hero__body {
      width: min(620px, 100%);
      margin: 16px 0 0;
      color: rgba(239, 246, 255, 0.86);
      line-height: 1.8;
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(2, 6, 23, 0.28);
      color: #f8fafc;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    main {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    .status {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.7);
      color: var(--muted);
    }

    .posts {
      display: grid;
      gap: 18px;
    }

    .blog-post {
      padding: 22px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background:
        linear-gradient(135deg, var(--accent-soft), transparent 45%),
        var(--panel);
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.24);
      transition:
        transform 0.18s ease,
        border-color 0.18s ease;
    }

    .blog-post.is-target {
      border-color: rgba(125, 211, 252, 0.62);
      transform: translateY(-2px);
    }

    .blog-post__head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .blog-post__title {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2rem);
      line-height: 1.2;
      color: #f8fafc;
    }

    .blog-post__permalink {
      color: #7dd3fc;
      font-size: 0.92rem;
    }

    .blog-post__meta {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .blog-post__summary {
      margin: 16px 0 0;
      color: #e0f2fe;
      font-weight: 700;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .blog-post__body {
      margin-top: 16px;
      color: var(--text);
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .blog-post__image {
      display: block;
      width: 100%;
      margin-top: 18px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.38);
      object-fit: cover;
      box-shadow: 0 18px 42px rgba(2, 6, 23, 0.24);
    }

    .blog-post__engagement {
      margin-top: 18px;
    }

    .rules-note {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(8, 15, 30, 0.56);
      color: var(--muted);
      line-height: 1.7;
    }

    footer {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: rgba(2, 6, 23, 0.44);
    }

    .footer-links {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 18px;
      font-size: 0.92rem;
    }

    .footer-links a {
      color: #bae6fd;
    }

    @media (max-width: 640px) {
      .hero {
        padding: 52px 18px 34px;
      }

      main {
        padding: 24px 18px 56px;
      }

      .blog-post {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <p class="eyebrow">Conbi Fan Journal</p>
      <h1>Blog</h1>
      <p class="hero__body">作ったものの進み具合、思いついたこと、ちょっとした記録をここにまとめるページ。公開記事だけを時系列で置いていく。コメントは各記事ごとに自由に書ける。</p>
      <div class="hero__actions">
        <a class="button" href="index.html">ホームへ戻る</a>
        <a class="button" href="rules.html">コメントルール</a>
      </div>
    </div>
  </header>

  <main>
    <p class="status" data-blog-status>読み込んでいます...</p>
    <div class="posts" data-blog-list></div>
    <p class="rules-note">このブログのコメントルールもサイト全体と共通。気になる場合は <a href="rules.html">コメントルール</a> を見てね。</p>
  </main>

  <footer>
    © 2026 Conbi Fan
    <div class="footer-links">
      <a href="index.html">ホーム</a>
      <a href="rules.html">コメントルール</a>
    </div>
  </footer>

  <script src="site-interactions-config.js"></script>
  <script type="module" src="site-interactions.js"></script>
  <script type="module" src="blog.js"></script>
</body>
</html>
