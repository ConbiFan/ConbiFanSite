<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>Conbi Fan - Owner</title>
  <link rel="stylesheet" href="site-interactions.css">
  <style>
    :root { --bg: #09111f; --panel: rgba(15,23,42,0.84); --border: rgba(148,163,184,0.18); --accent: #38bdf8; --text: #e2e8f0; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background: radial-gradient(circle at top,rgba(56,189,248,0.2),transparent 28%),linear-gradient(180deg,#0a1326,var(--bg)); }
    a { color:#bae6fd; text-decoration:none; }
    main { width:min(920px,100%); margin:0 auto; padding:48px 24px 64px; }
    h1 { font-size:clamp(2rem,5vw,3rem); margin:0 0 8px; }
    h2 { font-size:1.4rem; margin:32px 0 12px; color:#f8fafc; }
    .status { margin:0 0 18px; padding:14px 16px; border-radius:16px; border:1px solid var(--border); background:rgba(15,23,42,0.7); color:var(--muted); }
    .form-grid { display:grid; gap:12px; max-width:420px; }
    .form-grid label { display:grid; gap:6px; font-size:0.88rem; color:#cbd5e1; }
    .form-grid input { width:100%; padding:10px 12px; border-radius:14px; border:1px solid rgba(148,163,184,0.2); background:rgba(15,23,42,0.88); color:#f8fafc; font:inherit; }
    .btn-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    button { border:none; cursor:pointer; padding:10px 16px; border-radius:12px; font:inherit; font-weight:700; transition:transform 0.18s ease,opacity 0.18s ease; }
    button:hover { transform:translateY(-1px); }
    button:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .primary { background:linear-gradient(135deg,var(--accent),#38bdf8); color:#fff; }
    .secondary { border:1px solid var(--border); background:rgba(15,23,42,0.72); color:#e2e8f0; }
    .danger { background:rgba(239,68,68,0.16); color:#fecaca; }
    .report-card, .ban-card { padding:18px; border-radius:18px; border:1px solid var(--border); background:var(--panel); margin-bottom:14px; }
    .report-head, .ban-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; }
    .report-title, .ban-user { font-weight:700; color:#f8fafc; }
    .report-time, .ban-time { font-size:0.82rem; color:var(--muted); }
    .report-meta, .ban-meta { font-size:0.88rem; color:var(--muted); margin-bottom:10px; white-space:pre-wrap; }
    .label { font-size:0.76rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:#93c5fd; margin-bottom:4px; }
    .report-box, .ban-reason { padding:12px; border-radius:14px; background:rgba(2,6,23,0.45); border:1px solid var(--border); font-size:0.92rem; line-height:1.6; white-space:pre-wrap; margin-bottom:12px; }
    .report-actions, .ban-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .tabs { display:flex; gap:8px; margin-bottom:18px; }
    .tab { padding:8px 16px; border-radius:999px; border:1px solid var(--border); background:rgba(15,23,42,0.5); color:var(--muted); font-size:0.88rem; font-weight:700; cursor:pointer; }
    .tab.is-active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .blog-entry { padding:18px; border-radius:18px; border:1px solid var(--border); background:var(--panel); margin-bottom:14px; }
    .blog-entry-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; }
    .blog-entry-title { margin:0; font-size:1.2rem; color:#f8fafc; }
    .blog-entry-badges { display:flex; gap:6px; }
    .badge { display:inline-flex; padding:3px 10px; border-radius:999px; border:1px solid var(--border); background:rgba(15,23,42,0.6); font-size:0.72rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:rgba(226,232,240,0.92); }
    .badge.is-draft { border-color:rgba(251,191,36,0.44); color:#fde68a; }
    .blog-entry-meta, .blog-entry-slug { font-size:0.88rem; color:var(--muted); margin:4px 0; }
    .blog-entry-summary { font-size:0.92rem; color:#cbd5e1; line-height:1.6; margin:8px 0; }
    .blog-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .blog-form { display:grid; gap:12px; max-width:680px; margin-bottom:24px; }
    .blog-form label { display:grid; gap:6px; font-size:0.88rem; color:#cbd5e1; }
    .blog-form input, .blog-form textarea { width:100%; padding:10px 12px; border-radius:14px; border:1px solid rgba(148,163,184,0.2); background:rgba(15,23,42,0.88); color:#f8fafc; font:inherit; }
    .blog-form textarea { min-height:180px; resize:vertical; line-height:1.6; }
    .blog-form .checkbox-row { display:flex; align-items:center; gap:8px; }
    .visitor-uid { margin-top:12px; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,0.5); font-size:0.82rem; color:var(--muted); }
    footer { padding:24px; text-align:center; color:var(--muted); background:rgba(2,6,23,0.44); }
    .footer-links { margin-top:10px; display:flex; flex-wrap:wrap; justify-content:center; gap:12px 18px; font-size:0.92rem; }
    @media(max-width:640px){ main{padding:32px 18px 48px;} .btn-row{flex-direction:column;} button{width:100%;} }
  </style>
</head>
<body>
  <main>
    <h1>Owner Console</h1>
    <p class="status" data-owner-page-status>読み込んでいます...</p>

    <form class="form-grid" data-owner-login-form>
      <label>パスワード<input type="password" data-owner-password autocomplete="current-password" required /></label>
      <div class="btn-row">
        <button type="submit" class="primary" data-owner-page-login>ログイン</button>
        <button type="button" class="secondary" data-owner-page-signup>初回登録</button>
        <button type="button" class="secondary" data-owner-page-reset>パスワード再設定</button>
      </div>
    </form>

    <form class="form-grid" data-owner-reset-form hidden>
      <label>新しいパスワード<input type="password" data-owner-new-password autocomplete="new-password" minlength="8" required /></label>
      <div class="btn-row"><button type="submit" class="primary" data-owner-page-save-password>新しいパスワードを保存</button></div>
    </form>

    <div class="btn-row" style="margin-top:18px;">
      <button type="button" class="secondary" data-owner-page-logout hidden>ログアウト</button>
      <a class="secondary" href="index.html" style="display:inline-flex;align-items:center;padding:10px 16px;border-radius:12px;">ホームへ戻る</a>
    </div>

    <div class="visitor-uid" data-owner-visitor-uid-row hidden>固定コメントUID: <span data-owner-visitor-uid></span></div>

    <div class="tabs" data-owner-tabs hidden>
      <button type="button" class="tab is-active" data-owner-tab="reports">通報一覧</button>
      <button type="button" class="tab" data-owner-tab="bans">BAN一覧</button>
      <button type="button" class="tab" data-owner-tab="blog">ブログ管理</button>
    </div>

    <section data-owner-reports-section hidden>
      <h2>通報一覧</h2>
      <p class="status" data-owner-reports-status>ログインすると表示されます。</p>
      <div data-owner-reports-list></div>
    </section>

    <section data-owner-bans-section hidden>
      <h2>BAN一覧</h2>
      <p class="status" data-owner-bans-status>ログインすると表示されます。</p>
      <div data-owner-bans-list></div>
    </section>

    <section data-owner-blog-section hidden>
      <h2>ブログ管理</h2>
      <p class="status" data-owner-blog-status>owner としてログインすると使える。</p>
      <form class="blog-form" data-owner-blog-form>
        <label>タイトル<input type="text" data-owner-blog-title maxlength="120" required /></label>
        <label>slug<input type="text" data-owner-blog-slug pattern="^[a-z0-9]+(?:-[a-z0-9]+)*$" /></label>
        <label>概要<textarea data-owner-blog-summary maxlength="220"></textarea></label>
        <label>画像URL<input type="url" data-owner-blog-image-url maxlength="2000" /></label>
        <label>本文<textarea data-owner-blog-body maxlength="12000" required></textarea></label>
        <label class="checkbox-row"><input type="checkbox" data-owner-blog-published checked />公開する</label>
        <div class="btn-row">
          <button type="submit" class="primary" data-owner-blog-save>記事を保存</button>
          <button type="button" class="secondary" data-owner-blog-cancel hidden>編集をやめる</button>
        </div>
      </form>
      <h3>記事一覧</h3>
      <div data-owner-blog-list></div>
    </section>
  </main>

  <footer>
    © 2026 Conbi Fan
    <div class="footer-links"><a href="index.html">ホーム</a><a href="blog.html">ブログ</a><a href="rules.html">コメントルール</a></div>
  </footer>

  <script src="site-interactions-config.js"></script>
  <script type="module" src="site-interactions.js"></script>
  <script type="module" src="blog.js"></script>
  <script type="module" src="owner.js"></script>
</body>
</html>
